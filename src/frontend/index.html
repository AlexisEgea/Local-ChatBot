<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local ChatBot</title>
    <!-- Bundles base, glass, layout, sidebar, messages, and composer styles. -->
    <link rel="stylesheet" href="./style/main.css" />
  </head>
  <body>
    <!-- Root shell: click the title to expand the workspace and reveal the menu. -->
    <div class="app" id="app">
      <!-- Extra left panel, same width as Chat Mode, shown when expanded. -->
      <aside class="side-rail" id="sidebar-outer-left" aria-expanded="false" aria-label="History">
        <div class="side-rail-content">
          <section class="sidebar-section">
            <h2>History</h2>
          </section>
        </div>
      </aside>

      <div class="app-core">
      <button type="button" class="header glass" id="app-toggle" aria-expanded="false">
        <h1>Local ChatBot</h1>
      </button>

      <div class="workspace">
        <aside class="sidebar glass" id="sidebar" hidden>
          <section class="sidebar-section">
            <h2>Model</h2>
          </section>
        </aside>

        <main class="conversation" id="conversation">
          <!-- Live message list. Assistant left, user right. -->
          <div id="chat-thread" class="thread" aria-live="polite">
            <p class="empty">How can I help you?</p>
          </div>

          <!-- Input sits inside the conversation; fields change with the selected layout. -->
          <form id="chat-form" class="composer">
            <div class="composer-stack glass" id="composer-stack">
              <div class="composer-picker" id="composer-picker" hidden>
                <button type="button" class="composer-choice" data-layout="user">
                  Default
                  <span>User Message</span>
                </button>
                <button type="button" class="composer-choice" data-layout="system-user">
                  Role-Based Prompt
                  <span>System and User Prompts</span>
                </button>
                <button type="button" class="composer-choice" data-layout="cgse">
                  CGSE 
                  <span>Context, Goal, Source, Expectation</span>
                </button>
              </div>
              <div class="composer-row" id="composer-row">
                <div id="composer-fields" class="composer-fields"></div>
                <button type="submit" id="chat-send" aria-label="Send">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 19V5M12 5l-6 6M12 5l6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
                </button>
              </div>
            </div>
          </form>
        </main>
      </div>
      </div>

      <!-- Extra right panel, same width as Chat Mode, shown when expanded. -->
      <aside class="side-rail" id="sidebar-outer-right" aria-expanded="false" aria-label="Chat Mode">
        <div class="side-rail-content" id="chat-mode">
          <section class="sidebar-section">
            <h2>Chat Mode</h2>
            <label class="sidebar-option">
              <input type="radio" name="choose-mode" value="picker" checked />
              Chat Bar
            </label>
            <label class="sidebar-option">
              <input type="radio" name="choose-mode" value="default" />
              Default 
            </label>
          </section>

          <section class="sidebar-section" id="default-layout-section" hidden>
            <h2>chat</h2>
            <button type="button" class="sidebar-layout is-active" data-layout="user">
              Default
              <span>User message</span>
            </button>
            <button type="button" class="sidebar-layout" data-layout="system-user">
              Role-Based Prompt
              <span>System and User Prompts</span>
            </button>
            <button type="button" class="sidebar-layout" data-layout="cgse">
              CGSE 
              <span>Context, Goal, Source, Expectation</span>
            </button>
          </section>

          <section class="sidebar-section">
            <h2>Theme</h2>
            <label class="sidebar-option">
              <input type="radio" name="theme-mode" value="light" checked />
              Light
            </label>
            <label class="sidebar-option">
              <input type="radio" name="theme-mode" value="dark" />
              Dark
            </label>
            <label class="sidebar-option">
              <input type="radio" name="theme-mode" value="custom" />
              Custom
            </label>
            <div id="theme-custom-section" hidden>
              <label class="theme-color">
                Background
                <input type="color" id="theme-bg-color" value="#e7e9ee" />
              </label>
              <label class="theme-color">
                Liquid glass
                <input type="color" id="theme-glass-color" value="#ffffff" />
              </label>
            </div>
          </section>
        </div>
      </aside>
    </div>
    <script type="module" src="./script/main.js"></script>
  </body>
</html>
